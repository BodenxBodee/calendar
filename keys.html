<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push Key Generator</title>
<style>
  :root { --bg:#fff; --text:#1f1f1f; --muted:#5f6368; --box:#f1f3f4; --accent:#1a73e8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131314; --text:#e3e3e3; --muted:#9aa0a6; --box:#282a2c; --accent:#a8c7fa; color-scheme: dark; } }
  body { background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,sans-serif; max-width:720px; margin:0 auto; padding:24px 16px; }
  h1 { font-weight:500; }
  p { color:var(--muted); }
  label { font-weight:600; display:block; margin-top:20px; }
  textarea { width:100%; box-sizing:border-box; background:var(--box); color:var(--text); border:none; border-radius:8px; padding:10px; font:13px ui-monospace,Menlo,monospace; resize:vertical; }
  button { background:var(--accent); color:var(--bg); border:none; border-radius:18px; padding:8px 18px; font:inherit; font-weight:600; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>
<h1>Push notification keys</h1>
<p>This makes the key pair the reminder sender needs (SETUP.md, step 7). Everything happens on this page; nothing is sent anywhere. Generate them <strong>once</strong>. A new pair would mean turning notifications on again on every device.</p>
<button id="gen">Generate keys</button>
<label for="pub">Public key → goes in <code>js/config.js</code> AND the GitHub secret <code>VAPID_PUBLIC_KEY</code></label>
<textarea id="pub" rows="3" readonly></textarea>
<label for="priv">Private key → GitHub secret <code>VAPID_PRIVATE_KEY</code> only. Keep it secret.</label>
<textarea id="priv" rows="2" readonly></textarea>
<script>
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('gen').onclick = async () => {
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const raw = await crypto.subtle.exportKey('raw', kp.publicKey);   // 65-byte uncompressed point
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);  // d = 32-byte private scalar
  document.getElementById('pub').value = b64url(raw);
  document.getElementById('priv').value = jwk.d;
};
</script>
</body>
</html>
